server:
  port: ${BANK_SERVICE_PORT:6706}
  shutdown: graceful
spring:
  application:
    name: bankService
  threads:
    virtual:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:8080/realms/birthday-hub}
          jwk-set-uri: ${OAUTH2_JWK_SET_URI:http://localhost:8080/realms/birthday-hub/protocol/openid-connect/certs}
  datasource:
    url: ${BANK_DB_URL:jdbc:postgresql://localhost:5438/bank}
    username: ${DB_USER:birthday}
    password: ${DB_PASSWORD:birthday}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    validate-migration-naming: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: bankService
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
internal:
  token: ${INTERNAL_TOKEN:local-internal-token}
outbox:
  relay-delay: ${OUTBOX_RELAY_DELAY:1000}
management:
  endpoint.health.probes.enabled: true
  endpoints.web.exposure.include: health,info,metrics,prometheus
springdoc.swagger-ui.path: /swagger-ui.html
