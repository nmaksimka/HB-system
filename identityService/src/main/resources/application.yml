server:
  port: ${IDENTITY_SERVICE_PORT:6701}
  shutdown: graceful
spring:
  application:
    name: identityService
  threads:
    virtual:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:8080/realms/birthday-hub}
          jwk-set-uri: ${OAUTH2_JWK_SET_URI:http://localhost:8080/realms/birthday-hub/protocol/openid-connect/certs}
  datasource:
    url: ${IDENTITY_DB_URL:jdbc:postgresql://localhost:5433/identity}
    username: ${DB_USER:birthday}
    password: ${DB_PASSWORD:birthday}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    validate-migration-naming: true
birthday:
  keycloak:
    base-url: ${KEYCLOAK_ADMIN_URL:http://localhost:8080}
    realm: ${KEYCLOAK_REALM:birthday-hub}
    admin-username: ${KEYCLOAK_ADMIN_USERNAME:admin}
    admin-password: ${KEYCLOAK_ADMIN_PASSWORD:admin}
internal:
  token: ${INTERNAL_TOKEN:local-internal-token}
management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
springdoc:
  swagger-ui:
    path: /swagger-ui.html
