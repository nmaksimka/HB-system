server:
  port: ${IDENTITY_SERVICE_PORT:6701}
  shutdown: graceful
spring:
  application:
    name: identityService
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${IDENTITY_DB_URL:jdbc:postgresql://localhost:5433/identity}
    username: ${DB_USER:birthday}
    password: ${DB_PASSWORD:birthday}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    validate-migration-naming: true
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connect-timeout: ${OPENFEIGN_CONNECT_TIMEOUT:1000}
            read-timeout: ${OPENFEIGN_READ_TIMEOUT:2000}
clients:
  gift:
    url: ${GIFT_SERVICE_URL:http://localhost:6702}
management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
springdoc:
  swagger-ui:
    path: /swagger-ui.html
