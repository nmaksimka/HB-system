server:
  port: ${GATEWAY_PORT:6967}
  shutdown: graceful
spring:
  application:
    name: apiGateway
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origin-patterns: "*"
                allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
                allowed-headers: "*"
          routes:
            - id: giftService
              uri: ${GIFT_SERVICE_URL:http://localhost:6702}
              predicates:
                - Path=/api/users/*/wishes,/api/users/*/wishes/**
            - id: chatWebSocket
              uri: ${CHAT_SERVICE_WS_URL:ws://localhost:6703}
              predicates:
                - Path=/ws/**
            - id: chatService
              uri: ${CHAT_SERVICE_URL:http://localhost:6703}
              predicates:
                - Path=/api/chat/**
            - id: notificationService
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:6704}
              predicates:
                - Path=/api/notifications/**
            - id: identityService
              uri: ${IDENTITY_SERVICE_URL:http://localhost:6701}
              predicates:
                - Path=/api/users/**,/api/groups/**,/api/subscriptions/**
management:
  endpoint.health.probes.enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics,prometheus
