server:
  port: 8080
  shutdown: graceful
spring:
  application:
    name: apiGateway
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origin-patterns: "*"
                allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
                allowed-headers: "*"
          routes:
            - id: giftService
              uri: http://localhost:8082
              predicates:
                - Path=/api/users/*/wishes,/api/users/*/wishes/**
            - id: chatWebSocket
              uri: ws://localhost:8083
              predicates:
                - Path=/ws/**
            - id: chatService
              uri: http://localhost:8083
              predicates:
                - Path=/api/chat/**
            - id: notificationService
              uri: http://localhost:8084
              predicates:
                - Path=/api/notifications/**
            - id: identityService
              uri: http://localhost:8081
              predicates:
                - Path=/api/users/**,/api/groups/**,/api/subscriptions/**
management:
  endpoint.health.probes.enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics,prometheus
