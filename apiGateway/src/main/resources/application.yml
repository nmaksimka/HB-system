server:
  port: ${GATEWAY_PORT:6767}
  shutdown: graceful
spring:
  application:
    name: apiGateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:8080/realms/birthday-hub}
          jwk-set-uri: ${OAUTH2_JWK_SET_URI:http://localhost:8080/realms/birthday-hub/protocol/openid-connect/certs}
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - ${FRONTEND_ALLOWED_ORIGIN:http://localhost:5173}
                  - http://localhost:6767
                allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
                allowed-headers: [Authorization, Content-Type, X-Requested-With]
          routes:
            - id: giftService
              uri: ${GIFT_SERVICE_URL:http://localhost:6702}
              predicates:
                - Path=/api/me/wishes,/api/me/wishes/**,/api/users/*/wishes,/api/users/*/wishes/**
            - id: chatWebSocket
              uri: ${CHAT_SERVICE_WS_URL:ws://localhost:6703}
              predicates:
                - Path=/ws/**
            - id: chatService
              uri: ${CHAT_SERVICE_URL:http://localhost:6703}
              predicates:
                - Path=/api/chat/**
            - id: notificationService
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:6704}
              predicates:
                - Path=/api/notifications/**
            - id: identityService
              uri: ${IDENTITY_SERVICE_URL:http://localhost:6701}
              predicates:
                - Path=/api/auth/**,/api/me,/api/me/**,/api/users/**,/api/groups/**,/api/subscriptions/**
management:
  endpoint.health.probes.enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics,prometheus
