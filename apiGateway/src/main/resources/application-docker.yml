spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: giftService
              uri: http://giftService:8082
              predicates:
                - Path=/api/users/*/wishes,/api/users/*/wishes/**
            - id: chatWebSocket
              uri: ws://chatService:8083
              predicates:
                - Path=/ws/**
            - id: chatService
              uri: http://chatService:8083
              predicates:
                - Path=/api/chat/**
            - id: notificationService
              uri: http://notificationService:8084
              predicates:
                - Path=/api/notifications/**
            - id: identityService
              uri: http://identityService:8081
              predicates:
                - Path=/api/users/**,/api/groups/**,/api/subscriptions/**
