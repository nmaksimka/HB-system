<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Birthday Hub</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;700&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <section id="authView" class="auth hidden">
    <div class="auth-calendar" aria-hidden="true">
      <div class="sheet">
        <span class="sheet-month" id="authMonth"></span>
        <span class="sheet-day" id="authDay"></span>
        <span class="sheet-weekday" id="authWeekday"></span>
      </div>
      <p class="auth-pitch">Дни рождения друзей, их списки желаний и общий сбор на подарок. Именинник ничего из этого не видит.</p>
    </div>

    <div class="auth-forms">
      <h1 class="brand">Birthday Hub</h1>
      <div class="switch" role="tablist">
        <button type="button" class="switch-option active" data-auth-mode="login" role="tab">Вход</button>
        <button type="button" class="switch-option" data-auth-mode="register" role="tab">Регистрация</button>
      </div>

      <form id="loginForm" class="form" autocomplete="on">
        <label>Логин<input name="username" autocomplete="username" required></label>
        <label>Пароль<input name="password" type="password" autocomplete="current-password" required></label>
        <button type="submit" class="button primary">Войти</button>
        <p class="hint">Демо-аккаунты с паролем <code>password</code>:
          <button type="button" class="link" data-demo="maxim">maxim</button>,
          <button type="button" class="link" data-demo="anna">anna</button>,
          <button type="button" class="link" data-demo="ivan">ivan</button>
        </p>
      </form>

      <form id="registerForm" class="form hidden" autocomplete="on">
        <label>Как вас зовут<input name="name" autocomplete="name" maxlength="120" required></label>
        <label>Дата рождения<input name="birthDate" type="date" required></label>
        <label>Логин<input name="username" autocomplete="username" minlength="3" maxlength="60" pattern="[a-zA-Z0-9._\-]+" title="Латинские буквы, цифры, точка, дефис и подчёркивание" required></label>
        <label>Пароль<input name="password" type="password" autocomplete="new-password" minlength="6" maxlength="120" required></label>
        <button type="submit" class="button primary">Создать аккаунт</button>
      </form>
    </div>
  </section>

  <section id="profileView" class="auth hidden">
    <div class="auth-forms single">
      <h1 class="brand">Почти готово</h1>
      <p class="muted">Укажите имя и дату рождения, чтобы друзья вас нашли.</p>
      <form id="profileForm" class="form">
        <label>Как вас зовут<input name="name" autocomplete="name" maxlength="120" required></label>
        <label>Дата рождения<input name="birthDate" type="date" required></label>
        <button type="submit" class="button primary">Сохранить</button>
      </form>
    </div>
  </section>

  <div id="appView" class="app hidden">
    <header class="topbar">
      <a class="brand small" href="#upcoming">Birthday Hub</a>
      <nav class="tabs" aria-label="Разделы">
        <a href="#upcoming" data-tab="upcoming">Ближайшие</a>
        <a href="#people" data-tab="people">Люди</a>
        <a href="#groups" data-tab="groups">Группы</a>
        <a href="#wishes" data-tab="wishes">Мой список</a>
      </nav>
      <div class="account">
        <span id="accountName"></span>
        <button type="button" class="link" id="logoutButton">Выйти</button>
      </div>
    </header>
    <main id="screen" class="screen"></main>
  </div>

  <dialog id="fundraiserDialog" class="dialog">
    <form id="fundraiserForm" class="form" method="dialog">
      <h2>Сбор на подарок</h2>
      <p class="muted" id="fundraiserWish"></p>
      <label>Название сбора<input name="title" maxlength="160" required></label>
      <label>Сколько собрать, ₽<input name="targetAmount" type="number" min="1" step="1" required></label>
      <div class="row-actions">
        <button type="button" class="button" data-close-dialog>Отмена</button>
        <button type="submit" class="button primary">Начать сбор</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
