server:
  port: ${GIFT_SERVICE_PORT:6702}
  shutdown: graceful
spring:
  application:
    name: giftService
  threads:
    virtual:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:8080/realms/birthday-hub}
          jwk-set-uri: ${OAUTH2_JWK_SET_URI:http://localhost:8080/realms/birthday-hub/protocol/openid-connect/certs}
  datasource:
    url: ${GIFT_DB_URL:jdbc:postgresql://localhost:5434/gift}
    username: ${DB_USER:birthday}
    password: ${DB_PASSWORD:birthday}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    validate-migration-naming: true
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connect-timeout: ${OPENFEIGN_CONNECT_TIMEOUT:1000}
            read-timeout: ${OPENFEIGN_READ_TIMEOUT:2000}
clients:
  identity:
    url: ${IDENTITY_SERVICE_URL:http://localhost:6701}
management:
  endpoint.health.probes.enabled: true
  endpoints.web.exposure.include: health,info,metrics,prometheus
springdoc.swagger-ui.path: /swagger-ui.html
