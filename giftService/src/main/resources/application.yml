server:
  port: ${GIFT_SERVICE_PORT:6702}
  shutdown: graceful
spring:
  application:
    name: giftService
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${GIFT_DB_URL:jdbc:postgresql://localhost:5434/gift}
    username: ${DB_USER:birthday}
    password: ${DB_PASSWORD:birthday}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    validate-migration-naming: true
management:
  endpoint.health.probes.enabled: true
  endpoints.web.exposure.include: health,info,metrics,prometheus
springdoc.swagger-ui.path: /swagger-ui.html
