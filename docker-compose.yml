name: ${COMPOSE_PROJECT_NAME:-birthdayplatform}

x-database: &database
  image: ${POSTGRES_IMAGE:-postgres:17-alpine}
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    interval: 5s
    timeout: 3s
    retries: 15
    start_period: 5s
  networks: [birthdayNetwork]

x-service: &service
  restart: unless-stopped
  networks: [birthdayNetwork]
  healthcheck:
    test: ["CMD-SHELL", "wget -q --spider http://localhost:$${SERVER_PORT}/actuator/health/readiness"]
    interval: 10s
    timeout: 3s
    retries: 12
    start_period: 30s

x-service-env: &serviceEnv
  SPRING_PROFILES_ACTIVE: docker
  OAUTH2_ISSUER_URI: ${OAUTH2_ISSUER_URI:-http://localhost:8080/realms/birthday-hub}
  OAUTH2_JWK_SET_URI: http://keycloak:8080/realms/birthday-hub/protocol/openid-connect/certs
  DB_USER: ${DB_USER:-birthday}
  DB_PASSWORD: ${DB_PASSWORD:-birthday}
  INTERNAL_TOKEN: ${INTERNAL_TOKEN:-local-internal-token}

services:
  keycloak:
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.2}
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
    ports: ["${KEYCLOAK_PORT:-8080}:8080"]
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    networks: [birthdayNetwork]

  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:3.9.0}
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s
    networks: [birthdayNetwork]

  identityDb:
    <<: *database
    environment:
      POSTGRES_DB: identity
      POSTGRES_USER: ${DB_USER:-birthday}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-birthday}
    volumes: [identityData:/var/lib/postgresql/data]

  giftDb:
    <<: *database
    environment:
      POSTGRES_DB: gift
      POSTGRES_USER: ${DB_USER:-birthday}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-birthday}
    volumes: [giftData:/var/lib/postgresql/data]

  chatDb:
    <<: *database
    environment:
      POSTGRES_DB: chat
      POSTGRES_USER: ${DB_USER:-birthday}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-birthday}
    volumes: [chatData:/var/lib/postgresql/data]

  notificationDb:
    <<: *database
    environment:
      POSTGRES_DB: notification
      POSTGRES_USER: ${DB_USER:-birthday}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-birthday}
    volumes: [notificationData:/var/lib/postgresql/data]

  fundraiserDb:
    <<: *database
    environment:
      POSTGRES_DB: fundraiser
      POSTGRES_USER: ${DB_USER:-birthday}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-birthday}
    volumes: [fundraiserData:/var/lib/postgresql/data]

  bankDb:
    <<: *database
    environment:
      POSTGRES_DB: bank
      POSTGRES_USER: ${DB_USER:-birthday}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-birthday}
    volumes: [bankData:/var/lib/postgresql/data]

  identityService:
    <<: *service
    build:
      context: .
      dockerfile: identityService/Dockerfile
    environment:
      <<: *serviceEnv
      SERVER_PORT: 6701
      KEYCLOAK_ADMIN_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    depends_on:
      keycloak: { condition: service_started }
      identityDb: { condition: service_healthy }

  giftService:
    <<: *service
    build:
      context: .
      dockerfile: giftService/Dockerfile
    environment:
      <<: *serviceEnv
      SERVER_PORT: 6702
    depends_on:
      giftDb: { condition: service_healthy }
      identityService: { condition: service_healthy }

  chatService:
    <<: *service
    build:
      context: .
      dockerfile: chatService/Dockerfile
    environment:
      <<: *serviceEnv
      SERVER_PORT: 6703
    depends_on:
      chatDb: { condition: service_healthy }
      identityService: { condition: service_healthy }

  notificationService:
    <<: *service
    build:
      context: .
      dockerfile: notificationService/Dockerfile
    environment:
      <<: *serviceEnv
      SERVER_PORT: 6704
    depends_on:
      notificationDb: { condition: service_healthy }
      identityService: { condition: service_healthy }

  fundraiserService:
    <<: *service
    build:
      context: .
      dockerfile: fundraiserService/Dockerfile
    environment:
      <<: *serviceEnv
      SERVER_PORT: 6705
    depends_on:
      fundraiserDb: { condition: service_healthy }
      kafka: { condition: service_healthy }
      giftService: { condition: service_healthy }
      bankService: { condition: service_healthy }

  bankService:
    <<: *service
    build:
      context: .
      dockerfile: bankService/Dockerfile
    environment:
      <<: *serviceEnv
      SERVER_PORT: 6706
    depends_on:
      bankDb: { condition: service_healthy }
      kafka: { condition: service_healthy }

  apiGateway:
    <<: *service
    build:
      context: .
      dockerfile: apiGateway/Dockerfile
    environment:
      OAUTH2_ISSUER_URI: ${OAUTH2_ISSUER_URI:-http://localhost:8080/realms/birthday-hub}
      OAUTH2_JWK_SET_URI: http://keycloak:8080/realms/birthday-hub/protocol/openid-connect/certs
      SERVER_PORT: 6767
      FRONTEND_ALLOWED_ORIGIN: ${FRONTEND_ALLOWED_ORIGIN:-http://localhost:5173}
      IDENTITY_SERVICE_URL: http://identityService:6701
      GIFT_SERVICE_URL: http://giftService:6702
      CHAT_SERVICE_URL: http://chatService:6703
      CHAT_SERVICE_WS_URL: ws://chatService:6703
      NOTIFICATION_SERVICE_URL: http://notificationService:6704
      FUNDRAISER_SERVICE_URL: http://fundraiserService:6705
      BANK_SERVICE_URL: http://bankService:6706
    ports: ["${GATEWAY_PORT:-6767}:6767"]
    depends_on:
      identityService: { condition: service_healthy }
      giftService: { condition: service_healthy }
      chatService: { condition: service_healthy }
      notificationService: { condition: service_healthy }
      fundraiserService: { condition: service_healthy }
      bankService: { condition: service_healthy }

networks:
  birthdayNetwork:
    driver: bridge

volumes:
  identityData:
  giftData:
  chatData:
  notificationData:
  fundraiserData:
  bankData:
