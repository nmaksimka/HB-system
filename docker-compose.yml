name: ${COMPOSE_PROJECT_NAME:-birthdayplatform}

x-database: &database
  image: ${POSTGRES_IMAGE:-postgres:17-alpine}
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    interval: 5s
    timeout: 3s
    retries: 15
    start_period: 5s
  networks: [birthdayNetwork]

x-service: &service
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment:
    SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
    OAUTH2_ISSUER_URI: ${OAUTH2_ISSUER_URI:-http://localhost:8080/realms/birthday-hub}
    OAUTH2_JWK_SET_URI: ${OAUTH2_JWK_SET_URI:-http://keycloak:8080/realms/birthday-hub/protocol/openid-connect/certs}
    GATEWAY_PORT: ${GATEWAY_PORT:-6767}
    IDENTITY_SERVICE_PORT: ${IDENTITY_SERVICE_PORT:-6701}
    GIFT_SERVICE_PORT: ${GIFT_SERVICE_PORT:-6702}
    CHAT_SERVICE_PORT: ${CHAT_SERVICE_PORT:-6703}
    NOTIFICATION_SERVICE_PORT: ${NOTIFICATION_SERVICE_PORT:-6704}
  networks: [birthdayNetwork]

services:
  keycloak:
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.2}
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
    ports: ["${KEYCLOAK_PORT:-8080}:8080"]
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    networks: [birthdayNetwork]

  identityDb:
    <<: *database
    environment:
      POSTGRES_DB: ${IDENTITY_DB_NAME:-identity}
      POSTGRES_USER: ${DB_USER:-birthday}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-birthday}
    ports: ["${IDENTITY_DB_PORT:-5433}:5432"]
    volumes: [identityData:/var/lib/postgresql/data]

  giftDb:
    <<: *database
    environment:
      POSTGRES_DB: ${GIFT_DB_NAME:-gift}
      POSTGRES_USER: ${DB_USER:-birthday}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-birthday}
    ports: ["${GIFT_DB_PORT:-5434}:5432"]
    volumes: [giftData:/var/lib/postgresql/data]

  chatDb:
    <<: *database
    environment:
      POSTGRES_DB: ${CHAT_DB_NAME:-chat}
      POSTGRES_USER: ${DB_USER:-birthday}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-birthday}
    ports: ["${CHAT_DB_PORT:-5435}:5432"]
    volumes: [chatData:/var/lib/postgresql/data]

  notificationDb:
    <<: *database
    environment:
      POSTGRES_DB: ${NOTIFICATION_DB_NAME:-notification}
      POSTGRES_USER: ${DB_USER:-birthday}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-birthday}
    ports: ["${NOTIFICATION_DB_PORT:-5436}:5432"]
    volumes: [notificationData:/var/lib/postgresql/data]

  identityService:
    <<: *service
    image: ${IDENTITY_SERVICE_IMAGE:-birthdayplatform/identity-service:local}
    build:
      context: .
      dockerfile: identityService/Dockerfile
    depends_on:
      keycloak:
        condition: service_started
      identityDb:
        condition: service_healthy
      giftService:
        condition: service_healthy
    ports: ["${IDENTITY_SERVICE_PORT:-6701}:${IDENTITY_SERVICE_PORT:-6701}"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:$${IDENTITY_SERVICE_PORT}/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 25s

  giftService:
    <<: *service
    image: ${GIFT_SERVICE_IMAGE:-birthdayplatform/gift-service:local}
    build:
      context: .
      dockerfile: giftService/Dockerfile
    depends_on:
      keycloak:
        condition: service_started
      giftDb:
        condition: service_healthy
    ports: ["${GIFT_SERVICE_PORT:-6702}:${GIFT_SERVICE_PORT:-6702}"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:$${GIFT_SERVICE_PORT}/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 25s

  chatService:
    <<: *service
    image: ${CHAT_SERVICE_IMAGE:-birthdayplatform/chat-service:local}
    build:
      context: .
      dockerfile: chatService/Dockerfile
    depends_on:
      keycloak:
        condition: service_started
      chatDb:
        condition: service_healthy
    ports: ["${CHAT_SERVICE_PORT:-6703}:${CHAT_SERVICE_PORT:-6703}"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:$${CHAT_SERVICE_PORT}/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 25s

  notificationService:
    <<: *service
    image: ${NOTIFICATION_SERVICE_IMAGE:-birthdayplatform/notification-service:local}
    build:
      context: .
      dockerfile: notificationService/Dockerfile
    depends_on:
      keycloak:
        condition: service_started
      notificationDb:
        condition: service_healthy
      identityService:
        condition: service_healthy
    ports: ["${NOTIFICATION_SERVICE_PORT:-6704}:${NOTIFICATION_SERVICE_PORT:-6704}"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:$${NOTIFICATION_SERVICE_PORT}/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 25s

  apiGateway:
    <<: *service
    image: ${API_GATEWAY_IMAGE:-birthdayplatform/api-gateway:local}
    build:
      context: .
      dockerfile: apiGateway/Dockerfile
    depends_on:
      keycloak:
        condition: service_started
      identityService:
        condition: service_healthy
      giftService:
        condition: service_healthy
      chatService:
        condition: service_healthy
      notificationService:
        condition: service_healthy
    ports: ["${GATEWAY_PORT:-6767}:${GATEWAY_PORT:-6767}"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:$${GATEWAY_PORT}/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

networks:
  birthdayNetwork:
    driver: bridge

volumes:
  identityData:
  giftData:
  chatData:
  notificationData:
