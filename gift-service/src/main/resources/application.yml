server:
  port: 8082
spring:
  application:
    name: gift-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/gift}
    username: ${DB_USER:birthday}
    password: ${DB_PASSWORD:birthday}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management.endpoints.web.exposure.include: health,info,metrics
