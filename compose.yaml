name: birthday-platform

x-service: &service
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  networks: [birthday-net]

x-db: &db
  image: postgres:17-alpine
  restart: unless-stopped
  environment:
    POSTGRES_USER: birthday
    POSTGRES_PASSWORD: birthday
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U birthday"]
    interval: 5s
    timeout: 3s
    retries: 15
  networks: [birthday-net]

services:
  identity-db:
    <<: *db
    environment:
      POSTGRES_USER: birthday
      POSTGRES_PASSWORD: birthday
      POSTGRES_DB: identity
    volumes: [identity-data:/var/lib/postgresql/data]

  gift-db:
    <<: *db
    environment:
      POSTGRES_USER: birthday
      POSTGRES_PASSWORD: birthday
      POSTGRES_DB: gift
    volumes: [gift-data:/var/lib/postgresql/data]

  chat-db:
    <<: *db
    environment:
      POSTGRES_USER: birthday
      POSTGRES_PASSWORD: birthday
      POSTGRES_DB: chat
    volumes: [chat-data:/var/lib/postgresql/data]

  notification-db:
    <<: *db
    environment:
      POSTGRES_USER: birthday
      POSTGRES_PASSWORD: birthday
      POSTGRES_DB: notification
    volumes: [notification-data:/var/lib/postgresql/data]

  identity-service:
    <<: *service
    build:
      context: .
      args: { MODULE: identity-service }
    environment:
      DB_URL: jdbc:postgresql://identity-db:5432/identity
      DB_USER: birthday
      DB_PASSWORD: birthday
      GIFT_SERVICE_URL: http://gift-service:8082
    depends_on:
      identity-db: { condition: service_healthy }
      gift-service: { condition: service_started }
    ports: ["8081:8081"]

  gift-service:
    <<: *service
    build:
      context: .
      args: { MODULE: gift-service }
    environment:
      DB_URL: jdbc:postgresql://gift-db:5432/gift
      DB_USER: birthday
      DB_PASSWORD: birthday
    depends_on:
      gift-db: { condition: service_healthy }
    ports: ["8082:8082"]

  chat-service:
    <<: *service
    build:
      context: .
      args: { MODULE: chat-service }
    environment:
      DB_URL: jdbc:postgresql://chat-db:5432/chat
      DB_USER: birthday
      DB_PASSWORD: birthday
    depends_on:
      chat-db: { condition: service_healthy }
    ports: ["8083:8083"]

  notification-service:
    <<: *service
    build:
      context: .
      args: { MODULE: notification-service }
    environment:
      DB_URL: jdbc:postgresql://notification-db:5432/notification
      DB_USER: birthday
      DB_PASSWORD: birthday
      IDENTITY_SERVICE_URL: http://identity-service:8081
    depends_on:
      notification-db: { condition: service_healthy }
      identity-service: { condition: service_started }
    ports: ["8084:8084"]

  api-gateway:
    <<: *service
    build:
      context: .
      args: { MODULE: api-gateway }
    environment:
      IDENTITY_SERVICE_URL: http://identity-service:8081
      GIFT_SERVICE_URL: http://gift-service:8082
      CHAT_SERVICE_URL: http://chat-service:8083
      CHAT_SERVICE_WS_URL: ws://chat-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
    depends_on:
      identity-service: { condition: service_started }
      gift-service: { condition: service_started }
      chat-service: { condition: service_started }
      notification-service: { condition: service_started }
    ports: ["8080:8080"]

networks:
  birthday-net:

volumes:
  identity-data:
  gift-data:
  chat-data:
  notification-data:
