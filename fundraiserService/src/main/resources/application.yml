server:
  port: ${FUNDRAISER_SERVICE_PORT:6705}
  shutdown: graceful
spring:
  application:
    name: fundraiserService
  threads:
    virtual:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:8080/realms/birthday-hub}
          jwk-set-uri: ${OAUTH2_JWK_SET_URI:http://localhost:8080/realms/birthday-hub/protocol/openid-connect/certs}
  datasource:
    url: ${FUNDRAISER_DB_URL:jdbc:postgresql://localhost:5437/fundraiser}
    username: ${DB_USER:birthday}
    password: ${DB_PASSWORD:birthday}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    validate-migration-naming: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: fundraiserService
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connect-timeout: ${OPENFEIGN_CONNECT_TIMEOUT:1000}
            read-timeout: ${OPENFEIGN_READ_TIMEOUT:2000}
clients:
  gift:
    url: ${GIFT_SERVICE_URL:http://localhost:6702}
  bank:
    url: ${BANK_SERVICE_URL:http://localhost:6706}
internal:
  token: ${INTERNAL_TOKEN:local-internal-token}
outbox:
  relay-delay: ${OUTBOX_RELAY_DELAY:1000}
management:
  endpoint.health.probes.enabled: true
  endpoints.web.exposure.include: health,info,metrics,prometheus
springdoc.swagger-ui.path: /swagger-ui.html
